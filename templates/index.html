{% extends 'base.html' %}

{% block content %}
<div class="hero-section card" style="background-color: var(--midnight-navy); color: white; border-radius: var(--radius-card); padding: 48px 24px; text-align: center; margin-bottom: -40px; z-index: 1; position: relative;">
    <h1 style="color: white; font-size: 40px; margin-bottom: 8px;">Explore more. Worry less.</h1>
    <p style="font-size: 18px; color: var(--sky);">Simple, reliable journeys across the region.</p>
</div>

<div class="search-panel card" style="position: relative; z-index: 2; margin: 0 24px 48px 24px; padding: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);">
    <form action="{{ url_for('search_flights') }}" method="POST" style="display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap;">
        
        <div style="flex: 1; min-width: 200px;">
            <label for="departure_city" style="font-size: 12px; font-weight: bold; color: var(--ink);">FROM</label>
            <select name="departure_city" id="departure_city" required>
                <option value="" disabled selected>Select Origin</option>
                <option value="Nairobi">Nairobi (NBO)</option>
                <option value="Mombasa">Mombasa (MBA)</option>
                <option value="Kisumu">Kisumu (KIS)</option>
            </select>
        </div>

        <div style="flex: 1; min-width: 200px;">
            <label for="destination_city" style="font-size: 12px; font-weight: bold; color: var(--ink);">TO</label>
            <select name="destination_city" id="destination_city" required>
                <option value="" disabled selected>Select Destination</option>
                <option value="Mombasa">Mombasa (MBA)</option>
                <option value="Nairobi">Nairobi (NBO)</option>
                <option value="Kisumu">Kisumu (KIS)</option>
            </select>
        </div>

        <div style="flex: 1; min-width: 150px;">
            <label for="departure_date" style="font-size: 12px; font-weight: bold; color: var(--ink);">DEPARTURE</label>
            <input type="date" name="departure_date" id="departure_date" required min="{{ range(1, 10000) | random }}"> 
            <!-- We will use JS to set the minimum date to today -->
        </div>

        <div style="flex: 0 0 auto;">
            <button type="submit" class="btn-primary">Search</button>
        </div>
    </form>
</div>

<div class="featured-destinations">
    <h2 style="margin-bottom: 24px;">Popular destinations</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
        <div class="card" style="border-top: 4px solid var(--sky);">
            <h3>Mombasa</h3>
            <p style="color: #666; font-size: 14px;">Coast & sunshine</p>
        </div>
        <div class="card" style="border-top: 4px solid var(--sky);">
            <h3>Kisumu</h3>
            <p style="color: #666; font-size: 14px;">Lakeside escapes</p>
        </div>
        <div class="card" style="border-top: 4px solid var(--sky);">
            <h3>Eldoret</h3>
            <p style="color: #666; font-size: 14px;">Rift Valley</p>
        </div>
    </div>
</div>

<script>
    // Ensure departure date cannot be in the past
    document.getElementById('departure_date').min = new Date().toISOString().split("T")[0];
</script>
{% endblock %}
